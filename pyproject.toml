[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugs26"
version = "0.1.0"
description = "Bug report evaluator - Integration subsystem prototype"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"integration" = ["templates/*.html", "supported_repos.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
