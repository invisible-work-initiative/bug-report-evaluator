<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bug report evaluator</title>
<style>body{font:16px sans-serif;max-width:50rem;margin:2rem auto;padding:0 1rem}
textarea{width:100%;height:14rem;font:14px monospace}input[type=text]{width:100%}
.note{background:#fff4d6;padding:.5rem 1rem;border-left:4px solid #e0a800}</style></head>
<body>
<h1>Bug report evaluator</h1>
<p class="note">Prototype: Input Evaluation and Claim Investigation are placeholders. Reports are processed in memory and not stored.</p>
<form method="post" action="/evaluate" enctype="multipart/form-data">
<p>Give <strong>exactly one</strong> of the three sources below.</p>
<p><label>Paste a bug report (markdown or text)<br><textarea name="text"></textarea></label></p>
<p><label>...or upload a .md / .txt file (max 200 KB)<br><input type="file" name="file" accept=".md,.txt"></label></p>
<p><label>...or a GitHub issue URL<br><input type="text" name="issue_url" placeholder="https://github.com/owner/repo/issues/123"></label></p>
<p><label>Repository URL (optional, for pasted or uploaded reports)<br><input type="text" name="repo_url" placeholder="https://github.com/owner/repo"></label></p>
<p><button type="submit">Evaluate</button></p>
</form></body></html>
